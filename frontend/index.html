<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f33" />
  <!-- 版本号唯一来源是前端共享目录里的 VERSION 常量；这里的标题与下方 [data-ver] 占位符由 ui 脚本启动时填入，
       避免同一版本号在 HTML 与 JS 里各写一份而漂移（曾出现「功能已是新版、界面仍显示旧版本号」）。 -->
  <title>DeepFish</title>
  <!-- 像素字体体积较大（~900 KB）：预加载，避免字体到达后再回流一次 -->
  <link rel="preload" href="assets/fonts/fusion-pixel-12px.woff2" as="font" type="font/woff2" crossorigin />
  <!-- 加载顺序：tokens（色板 / 断点 / 全局焦点环）→ 基础 → 组件 → 响应式 → mobile 最后 -->
  <link rel="stylesheet" href="css/tokens.css?v=0.26.0" />
  <link rel="stylesheet" href="css/style.css?v=0.26.0" />
  <link rel="stylesheet" href="css/pixel.css?v=0.26.0" />
  <link rel="stylesheet" href="css/voyage-map.css?v=0.26.0" />
  <link rel="stylesheet" href="css/smelt.css?v=0.26.0" />
  <link rel="stylesheet" href="css/expedition.css?v=0.26.0" />
  <link rel="stylesheet" href="css/mail.css?v=0.26.0" />
  <link rel="stylesheet" href="css/gear.css?v=0.26.0" />
  <link rel="stylesheet" href="css/settings.css?v=0.26.0" />
  <link rel="stylesheet" href="css/fishing.css?v=0.26.0" />
  <link rel="stylesheet" href="css/responsive.css?v=0.26.0" />
  <link rel="stylesheet" href="css/mobile.css?v=0.26.0" />
  <script src="js/settings.js?v=0.26.0" defer></script>
</head>
<body>
  <header class="topbar">
    <div id="brand-logo" class="brand">🎣 DeepFish <span class="ver" data-ver></span></div>
    <div id="player-status" class="player-status"></div>
    <div class="topbar-actions">
      <a id="wiki-btn" class="wiki-btn" href="wiki/index.html" target="_blank" rel="noopener">📚 WIKI</a>
      <button id="settings-btn" type="button" aria-haspopup="dialog" aria-controls="settings-dialog">⚙ 设置</button>
      <!-- 退出登录入口在「设置」对话框里；这个隐藏按钮保留原有的登出流程与监听（ui.js wireAuth） -->
      <button id="logout-btn" class="logout-btn" type="button" hidden>退出登录</button>
    </div>
  </header>

  <!-- 顶部横幅两条独立轨道：纪录/最大鱼播报（按顺序排队） + 管理后台公告（可自定义颜色） -->
  <div id="record-banner" class="record-banner"></div>
  <div id="notice-banner" class="record-banner notice-banner"></div>

  <div class="layout">
    <aside class="sidebar">
      <nav id="nav" class="nav"></nav>
    </aside>
    <main id="main" class="content"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="auth" class="auth-overlay">
    <form id="auth-form" class="auth-card" autocomplete="on">
      <div class="brand-big">🎣 DeepFish</div>
      <div class="auth-sub"><span data-ver></span> · 注册或登录后开始（支持真实多人联机）</div>
      <div class="auth-tabs">
        <button id="tab-login" class="active" type="button" data-tab="login">登录</button>
        <button id="tab-register" type="button" data-tab="register">注册</button>
      </div>
      <label class="sr-only" for="auth-user">用户名</label>
      <input id="auth-user" class="auth-input" placeholder="用户名（3-20 位字母/数字/下划线）" autocomplete="username" />
      <label class="sr-only" for="auth-pass">密码</label>
      <input id="auth-pass" class="auth-input" type="password" placeholder="密码（注册至少 8 位）" autocomplete="current-password" />
      <!-- 仅注册时显示 -->
      <label class="sr-only" for="auth-pass2">确认密码</label>
      <input id="auth-pass2" class="auth-input" type="password" placeholder="确认密码（再次输入）" autocomplete="new-password" style="display:none" />
      <label class="sr-only" for="auth-qq">QQ 号</label>
      <input id="auth-qq" class="auth-input" placeholder="QQ 号（必填，5-12 位数字）" autocomplete="off" style="display:none" />
      <label class="sr-only" for="auth-name">显示名</label>
      <input id="auth-name" class="auth-input" placeholder="显示名（注册可选，留空等同用户名）" style="display:none" />
      <button id="auth-submit" class="primary big" type="submit">登录</button>
      <div id="auth-msg" class="auth-msg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <!-- 全部 defer：settings.js 原先比 UI.init() 晚跑，导致设置界面读到未初始化的 UI。
       统一 defer 后按文档顺序执行，init 等 DOMContentLoaded（defer 全部跑完）再启动。 -->
  <script src="js/config.js?v=0.26.0" defer></script>
  <script src="js/data.js?v=0.26.0" defer></script>
  <script src="js/features.js?v=0.26.0" defer></script>
  <script src="js/engine.js?v=0.26.0" defer></script>
  <script src="js/scene.js?v=0.26.0" defer></script>
  <script src="js/net.js?v=0.26.0" defer></script>
  <script src="js/voyage-map.js?v=0.26.0" defer></script>
  <script src="js/expedition.js?v=0.26.0" defer></script>
  <script src="js/gear.js?v=0.26.0" defer></script>
  <script src="js/expedition-growth.js?v=0.26.0" defer></script>
  <script src="js/mail.js?v=0.26.0" defer></script>
  <script src="js/house.js?v=0.26.0" defer></script>
  <script src="js/ui.js?v=0.26.0" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      window.Engine.init();
      window.UI.init();
    });
  </script>
</body>
</html>
