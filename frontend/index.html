<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f33" />
  <!-- 版本号唯一来源是前端共享目录里的 VERSION 常量；这里的标题与下方 [data-ver] 占位符由 ui 脚本启动时填入，
       避免同一版本号在 HTML 与 JS 里各写一份而漂移（曾出现「功能已是新版、界面仍显示旧版本号」）。 -->
  <title>钓鱼网站</title>
  <link rel="stylesheet" href="css/style.css?v=0.22.0" />
  <link rel="stylesheet" href="css/pixel.css?v=0.22.0" />
  <link rel="stylesheet" href="css/voyage-map.css?v=0.22.0" />
  <link rel="stylesheet" href="css/responsive.css?v=0.22.0" />
  <link rel="stylesheet" href="css/mobile.css?v=0.22.0" />
  <link rel="stylesheet" href="css/smelt.css?v=0.22.0" />
  <link rel="stylesheet" href="css/expedition.css?v=0.22.0" />
  <link rel="stylesheet" href="css/mail.css?v=0.22.0" />
  <link rel="stylesheet" href="css/gear.css?v=0.22.0" />
  <link rel="stylesheet" href="css/settings.css?v=0.22.0" />
  <link rel="stylesheet" href="css/fishing.css?v=0.22.0" />
  <script src="js/settings.js?v=0.22.0" defer></script>
</head>
<body>
  <header class="topbar">
    <div id="brand-logo" class="brand">🎣 钓鱼网站 <span class="ver" data-ver></span></div>
    <div id="player-status" class="player-status"></div>
    <div class="topbar-actions">
      <a id="wiki-btn" class="wiki-btn" href="wiki/index.html" target="_blank" rel="noopener">📚 WIKI</a>
      <button id="settings-btn" type="button" aria-haspopup="dialog" aria-controls="settings-dialog">⚙ 设置</button>
      <button id="logout-btn" class="logout-btn" title="退出登录">退出登录</button>
    </div>
  </header>

  <!-- 顶部横幅两条独立轨道：纪录/最大鱼播报（按顺序排队） + 管理后台公告（可自定义颜色） -->
  <div id="record-banner" class="record-banner"></div>
  <div id="notice-banner" class="record-banner notice-banner"></div>

  <div class="layout">
    <aside class="sidebar">
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">选择功能 · 页内切换子功能</div>
    </aside>
    <main id="main" class="content"></main>
  </div>

  <div id="toast" class="toast"></div>

  <div id="auth" class="auth-overlay">
    <div class="auth-card">
      <div class="brand-big">🎣 钓鱼网站</div>
      <div class="auth-sub"><span data-ver></span> · 注册或登录后开始（支持真实多人联机）</div>
      <div class="auth-tabs">
        <button id="tab-login" class="active" data-tab="login">登录</button>
        <button id="tab-register" data-tab="register">注册</button>
      </div>
      <input id="auth-user" class="auth-input" placeholder="用户名（3-20 位字母/数字/下划线）" autocomplete="username" />
      <input id="auth-pass" class="auth-input" type="password" placeholder="密码（注册至少 8 位）" autocomplete="current-password" />
      <!-- 仅注册时显示 -->
      <input id="auth-pass2" class="auth-input" type="password" placeholder="确认密码（再次输入）" autocomplete="new-password" style="display:none" />
      <input id="auth-qq" class="auth-input" placeholder="QQ 号（必填，5-12 位数字）" autocomplete="off" style="display:none" />
      <input id="auth-name" class="auth-input" placeholder="显示名（注册可选，留空等同用户名）" style="display:none" />
      <button id="auth-submit" class="primary big">登录</button>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <script src="js/config.js?v=0.22.0"></script>
  <script src="js/data.js?v=0.22.0"></script>
  <script src="js/features.js?v=0.22.0"></script>
  <script src="js/engine.js?v=0.22.0"></script>
  <script src="js/scene.js?v=0.22.0"></script>
  <script src="js/net.js?v=0.22.0"></script>
  <script src="js/voyage-map.js?v=0.22.0"></script>
  <script src="js/expedition.js?v=0.22.0"></script>
  <script src="js/gear.js?v=0.22.0"></script>
  <script src="js/expedition-growth.js?v=0.22.0"></script>
  <script src="js/mail.js?v=0.22.0"></script>
  <script src="js/ui.js?v=0.22.0"></script>
  <script>
    window.Engine.init();
    window.UI.init();
  </script>
</body>
</html>
