<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wiki · 钓鱼网站</title>
<style>
:root { color-scheme: dark; --bg:#101820; --panel:#182634; --line:#2b4055; --text:#e8f2fb; --muted:#9fb4c6; --ok:#5ad07a; --bad:#ff7070; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
main { max-width:880px; margin:0 auto; padding:32px 20px 56px; }
h1 { margin:0; font-size:32px; letter-spacing:.04em; }
.subtitle { margin:6px 0 24px; color:var(--muted); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
.status { display:flex; align-items:center; gap:10px; font-weight:700; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 4px rgba(255,255,255,.05); }
.state-ok .dot { background:var(--ok); }
.state-bad .dot { background:var(--bad); }
.message { min-height:24px; color:var(--muted); }
dl { display:grid; grid-template-columns:150px 1fr; gap:8px 14px; margin:0; }
dt { color:var(--muted); }
dd { margin:0; overflow-wrap:anywhere; }
.note { margin-top:18px; color:var(--muted); }
code { color:#b8e0ff; }
@media (max-width:600px) { main { padding-top:22px; } dl { grid-template-columns:1fr; } dt { margin-top:8px; } }
</style>
</head>
<body>
<main>
  <h1>wiki</h1>
  <p class="subtitle">钓鱼网站配套资料站 · M1 规则快照验收页</p>
  <section class="card" id="status-card" aria-live="polite">
    <div class="status"><span class="dot" aria-hidden="true"></span><span id="state">规则同步中</span></div>
    <p class="message" id="message">正在连接正式服务端规则快照…</p>
    <dl id="snapshot-fields" hidden>
      <dt>游戏版本</dt><dd id="game-version">-</dd>
      <dt>规则版本</dt><dd id="rules-version">-</dd>
      <dt>来源提交</dt><dd id="source-commit">-</dd>
      <dt>配置代数</dt><dd id="config-revision">-</dd>
      <dt>配置哈希</dt><dd id="config-hash">-</dd>
      <dt>快照时间</dt><dd id="generated-at">-</dd>
      <dt>目录规模</dt><dd id="catalog-counts">-</dd>
      <dt>钓点规模</dt><dd id="ground-counts">-</dd>
    </dl>
  </section>
  <p class="note">完整图鉴、攻略、配装模拟器与熔炼模拟器将在后续阶段实现。本页仅验证同域托管、规则快照、ETag 轮询与失联禁用闸门。</p>
</main>
<script>
'use strict';
(function () {
  const state = { etag: null, lastOk: 0, timer: 0, staleTimer: 0, fields: null };
  const el = id => document.getElementById(id);
  function setState(ok, text, message) {
    const card = el('status-card');
    card.classList.toggle('state-ok', ok === true);
    card.classList.toggle('state-bad', ok === false);
    el('state').textContent = text;
    el('message').textContent = message;
    if (ok === false) state.fields.hidden = true;
  }
  function render(s) {
    state.fields.hidden = false;
    el('game-version').textContent = s.gameVersion || '-';
    el('rules-version').textContent = s.rulesVersion || '-';
    el('source-commit').textContent = s.sourceCommit || '-';
    el('config-revision').textContent = s.configRevision || '-';
    el('config-hash').textContent = s.configHash || '-';
    el('generated-at').textContent = s.generatedAt ? new Date(s.generatedAt).toLocaleString() : '-';
    const c = s.catalog || {};
    el('catalog-counts').textContent = [
      (c.fish || []).length + ' 鱼',
      (c.materials || []).length + ' 材料',
      (c.components || []).length + ' 组件',
      (c.chests || []).length + ' 宝匣',
      (c.rodParts || []).length + ' 部位'
    ].join(' · ');
    const spots = (s.grounds || []).reduce((n, g) => n + (g.spots || []).length, 0);
    el('ground-counts').textContent = (s.grounds || []).length + ' 个钓场 · ' + spots + ' 个钓点';
  }
  function valid(s) {
    return !!(s && s.schemaVersion === 1 && s.gameVersion && s.rulesVersion &&
      /^[0-9a-f]{40}$/.test(s.sourceCommit || '') && s.serverInstanceId &&
      Number(s.configRevision) >= 1 && /^[0-9a-f]{64}$/.test(s.configHash || '') &&
      s.snapshotId && s.generatedAt && !isNaN(Date.parse(s.generatedAt)) &&
      s.catalog && s.grounds && s.rulesConfig && s.rulesConfig.castCfg &&
      typeof s.rulesConfig.biteFormula === 'string');
  }
  async function refresh() {
    const headers = {};
    if (state.etag) headers['If-None-Match'] = state.etag;
    try {
      const res = await fetch('/api/version?profile=wiki', { headers: headers, cache: 'no-cache' });
      if (res.status === 304) {
        state.lastOk = Date.now();
        setState(true, '规则可用', '配置未变化，服务器返回 304。');
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || data.profile !== 'wiki' || !valid(data.snapshot)) throw new Error('规则快照结构无效');
      state.etag = res.headers.get('ETag');
      state.lastOk = Date.now();
      render(data.snapshot);
      setState(true, '规则可用', '已连接当前服务端规则快照。');
    } catch (e) {
      setState(false, '规则不可用', '无法确认最新规则，数值与模拟器已禁用：' + (e && e.message || e));
    }
  }
  function checkStale() {
    if (state.lastOk && Date.now() - state.lastOk > 10000) {
      setState(false, '规则不可用', '超过 10 秒未确认最新配置，数值与模拟器已禁用。');
    }
  }
  state.fields = el('snapshot-fields');
  state.timer = setInterval(refresh, 5000);
  state.staleTimer = setInterval(checkStale, 1000);
  window.addEventListener('focus', refresh);
  refresh();
})();
</script>
</body>
</html>
