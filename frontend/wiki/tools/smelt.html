<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/assets/fish/crucian.png"><meta name="description" content="钓鱼网站配套资料站，提供钓场、攻略、更新记录、配装模拟器与熔炼模拟器。"><title>熔炼模拟器 · WIKI</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pixel.css"><link rel="stylesheet" href="/css/smelt.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="/css/mobile.css"><link rel="stylesheet" href="/wiki/css/wiki.css"><link rel="stylesheet" href="/wiki/tools/tool.css"></head>
<body data-page="smelt">
<header class="topbar wiki-topbar">
  <a class="brand" href="/wiki/">🎣 钓鱼网站 <span class="ver">WIKI</span></a>
  <form class="wiki-search-form" action="/wiki/search/index.html" role="search">
    <input class="wiki-search-input" type="search" name="q" placeholder="搜索钓场、攻略或工具" aria-label="全站搜索">
    <button class="primary" type="submit">搜索</button>
  </form>
  <a class="nav-item wiki-game-link" href="/">返回游戏</a>
</header>
<div class="layout">
  <aside class="sidebar">
    <nav class="nav" aria-label="WIKI 主导航">
        <a class="nav-item" data-nav="home" href="/wiki/"><span class="nav-icon">🏠</span><span>首页</span></a>
        <a class="nav-item" data-nav="grounds" href="/wiki/grounds/"><span class="nav-icon">🌊</span><span>钓场</span></a>
        <a class="nav-item" data-nav="guides" href="/wiki/guides/"><span class="nav-icon">📚</span><span>攻略</span></a>
        <a class="nav-item" data-nav="build" href="/wiki/tools/build.html"><span class="nav-icon">🧠</span><span>配装</span></a>
        <a class="nav-item active" data-nav="smelt" href="/wiki/tools/smelt.html"><span class="nav-icon">🔥</span><span>熔炼</span></a>
        <a class="nav-item" data-nav="updates" href="/wiki/updates/"><span class="nav-icon">📜</span><span>更新</span></a>
    </nav>
    <div class="side-foot">资料 · 攻略 · 模拟器</div>
  </aside>
  <main id="main" class="content">
    <section class="panel wide wiki-tool-panel">
      <h2>🔥 熔炼模拟器 <span class="subtitle">主副件 · 投料 · 概率 · 批量模拟</span></h2>
      <div id="status-card" class="status-card" aria-live="polite"></div>
      <div class="smelt-workbench">
        <fieldset class="sm-draft">
          <legend class="sr-only">熔炼方案</legend>
          <div class="sm-step-title"><h3>01 <span>选择组件与词条</span></h3><span>主件保留 · 副件搬移</span></div>
          <div class="ws-grid">
            <section class="ws-col" data-slot="main">
              <header class="sm-slot-head"><h3>主组件</h3><span class="sm-badge">保留底材</span></header>
              <div id="main-editor"></div>
            </section>
            <section class="ws-col" data-slot="sub">
              <header class="sm-slot-head"><h3>副组件</h3><span class="sm-badge">熔炼后消耗</span></header>
              <div id="sub-editor"></div>
            </section>
          </div>
          <div class="sm-step-title"><h3>02 <span>辅助材料</span></h3><span>可选</span></div>
          <section class="ws-col">
            <div id="materials" class="wiki-material-grid"></div>
            <div class="sm-options">
              <label class="sm-option"><img src="/assets/item/dragonpearl.png" alt=""><span><strong>龙宫宝珠</strong><small>边界取值</small></span><input type="checkbox" id="pearl"></label>
              <div class="sm-option"><img src="/assets/item/relic.png" alt=""><div class="sm-relic-copy"><strong>保护残片</strong><label class="sm-relic-input">投入 <input class="ipt" type="number" id="relics" min="0" value="0"> 片</label></div></div>
            </div>
          </section>
          <div class="sm-step-title"><h3>03 <span>批量模拟</span></h3><span>独立试验</span></div>
          <section class="ws-col">
            <div class="toolbar">
              <label class="check">次数 <input type="number" id="batch-count" min="1" max="10000" value="1000"></label>
              <button id="batch-start" type="button">开始</button>
              <button id="batch-cancel" type="button" disabled>取消</button>
            </div>
            <progress id="batch-progress" max="100" value="0"></progress>
            <div id="batch-result"></div>
          </section>
        </fieldset>
        <aside class="sm-preview-panel" aria-label="熔炼计算结果">
          <header><h3>产物预览</h3><span>实时更新</span></header>
          <div id="preview" class="ws-preview"></div>
          <div class="wiki-preview-block"><h4>单次模拟</h4><div class="toolbar"><button id="simulate-once" type="button">模拟一次</button><button id="send-to-build" type="button">带入配装</button></div><div id="single-result"></div></div>
        </aside>
      </div>
    </section>
  </main>
</div>
  <script src="/js/data.js"></script>
  <script src="/wiki/js/core.js"></script>
  <script src="/wiki/tools/smelt.js"></script>
</body>
</html>
