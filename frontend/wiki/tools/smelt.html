<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/fish/crucian.png"><title>熔炼模拟器 · wiki</title><link rel="stylesheet" href="/wiki/css/wiki.css"><link rel="stylesheet" href="/wiki/tools/tool.css"></head>
<body><main class="wiki-shell"><header class="wiki-header"><div><h1 class="wiki-title">熔炼模拟器</h1><p class="wiki-subtitle">主副件 · 投料 · 概率 · 批量模拟</p></div><nav class="wiki-nav"><a href="/wiki/">首页</a><a href="/wiki/items/index.html">图鉴</a><a href="/wiki/tools/build.html">配装</a></nav></header><section id="status-card"></section>
<section class="wiki-grid"><section class="card"><h2>主件</h2><div id="main-editor"></div></section><section class="card"><h2>副件</h2><div id="sub-editor"></div></section></section>
<section class="card"><h2>投入</h2><div id="materials"></div><div class="toolbar"><label><input type="checkbox" id="pearl"> 龙宫宝珠（边界取值）</label><label>保护残片 <input type="number" id="relics" min="0" value="0"></label></div></section>
<section class="wiki-grid"><section class="card"><h2>确定性预览</h2><div id="preview"></div></section><section class="card"><h2>单次模拟</h2><div class="toolbar"><button id="simulate-once">模拟一次</button><button id="send-to-build">带入配装</button></div><div id="single-result"></div></section></section>
<section class="card"><h2>批量模拟</h2><div class="toolbar"><input type="number" id="batch-count" min="1" max="10000" value="1000"><button id="batch-start">开始</button><button id="batch-cancel" disabled>取消</button><progress id="batch-progress" max="100" value="0"></progress></div><div id="batch-result"></div></section>
</main><script src="/js/data.js"></script><script src="/wiki/js/core.js"></script><script src="/wiki/tools/smelt.js"></script></body></html>
