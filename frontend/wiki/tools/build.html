<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/fish/crucian.png"><title>配装模拟器 · wiki</title><link rel="stylesheet" href="/wiki/css/wiki.css"><link rel="stylesheet" href="/css/smelt.css"><link rel="stylesheet" href="/wiki/tools/tool.css"></head>
<body><main class="wiki-shell"><header class="wiki-header"><div><h1 class="wiki-title">配装模拟器</h1><p class="wiki-subtitle">七部位编辑 · 钓点条件 · A/B 对比</p></div><nav class="wiki-nav"><a href="/wiki/">首页</a><a href="/wiki/items/index.html">图鉴</a><a href="/wiki/grounds/index.html">钓场</a><a href="/wiki/tools/smelt.html">熔炼</a></nav></header><section id="status-card"></section>
<div class="smelt-workbench wiki-tool-workbench"><div class="wiki-tool-editor">
<section class="ws-col"><div class="sm-step-title"><h3>方案</h3><span>A / B 对比与分享</span></div><div class="toolbar"><button id="plan-a">方案 A</button><button id="plan-b">方案 B</button><button id="copy-plan">复制到另一方案</button><button id="clear-plan">清空</button><button id="load-smelt">读取熔炼产物</button><label><input type="checkbox" id="research-mode"> 自由试算</label></div><div class="toolbar"><input id="plan-name" aria-label="方案名称"><select id="spot-select" aria-label="钓点"></select><button id="save-plan">保存</button><select id="saved-plans" aria-label="已保存方案"></select><button id="load-plan">读取</button><button id="delete-plan">删除</button></div><div class="toolbar"><button id="share-link">生成链接</button><button id="export-code">导出方案码</button><button id="import-code">导入方案码</button><button id="adopt-import">另存为当前规则</button><input id="share-code" aria-label="方案码"><a id="share-link-output" class="button" hidden>打开分享链接</a></div></section>
<section class="ws-col"><div class="sm-step-title"><h3 id="slot-title">组件编辑</h3><span>七个部位逐项调整</span></div><div id="slots"></div></section>
</div><aside class="sm-preview-panel wiki-tool-preview" aria-label="配装计算结果"><header><h3>计算结果</h3><span>实时更新</span></header><div class="wiki-preview-block"><h4>当前结果</h4><div id="current-result"></div></div><div class="wiki-preview-block"><h4>对比结果</h4><div id="compare-result"></div></div></aside></div>
</main><script src="/js/data.js"></script><script src="/wiki/js/core.js"></script><script src="/wiki/tools/build.js"></script></body></html>
