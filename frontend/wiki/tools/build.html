<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/assets/fish/crucian.png"><meta name="description" content="DeepFish 配套资料站，提供钓场、渔获/材料/组件搜索、攻略、更新记录、配装模拟器与熔炼模拟器。"><title>配装模拟器 · WIKI</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/pixel.css"><link rel="stylesheet" href="/css/smelt.css"><link rel="stylesheet" href="/css/responsive.css"><link rel="stylesheet" href="/css/mobile.css"><link rel="stylesheet" href="/wiki/css/wiki.css"><link rel="stylesheet" href="/wiki/tools/tool.css"></head>
<body data-page="build">
<header class="topbar wiki-topbar">
  <a class="brand" href="/wiki/">🎣 DeepFish <span class="ver">WIKI</span></a>
  <form class="wiki-search-form" action="/wiki/search/index.html" role="search">
    <input class="wiki-search-input" type="search" name="q" placeholder="搜索钓场、渔获、材料、组件或攻略" aria-label="全站搜索：钓场、渔获、材料、组件或攻略">
    <button class="primary" type="submit">搜索</button>
  </form>
  <a class="nav-item wiki-game-link" href="/">返回游戏</a>
</header>
<div class="layout">
  <aside class="sidebar">
    <nav class="nav" aria-label="WIKI 主导航">
        <a class="nav-item" data-nav="home" href="/wiki/"><span class="nav-icon">🏠</span><span>首页</span></a>
        <a class="nav-item" data-nav="search" href="/wiki/search/"><span class="nav-icon">🔎</span><span>搜索</span></a>
        <a class="nav-item" data-nav="grounds" href="/wiki/grounds/"><span class="nav-icon">🌊</span><span>钓场</span></a>
        <a class="nav-item" data-nav="guides" href="/wiki/guides/"><span class="nav-icon">📚</span><span>攻略</span></a>
        <a class="nav-item active" data-nav="build" href="/wiki/tools/build.html"><span class="nav-icon">🧠</span><span>配装</span></a>
        <a class="nav-item" data-nav="smelt" href="/wiki/tools/smelt.html"><span class="nav-icon">🔥</span><span>熔炼</span></a>
        <a class="nav-item" data-nav="updates" href="/wiki/updates/"><span class="nav-icon">📜</span><span>更新</span></a>
    </nav>
    <div class="side-foot">资料 · 攻略 · 模拟器</div>
  </aside>
  <main id="main" class="content">
    <section class="panel wide wiki-tool-panel">
      <h2>🧠 配装模拟器 <span class="subtitle">七部位编辑 · 钓点条件 · A/B 对比</span></h2>
      <div id="status-card" class="status-card" aria-live="polite"></div>
      <div class="smelt-workbench">
        <fieldset class="sm-draft">
          <legend class="sr-only">配装方案</legend>
          <section class="ws-col">
            <div id="inventory-panel"></div>
            <div class="toolbar"><select id="inventory-rod" aria-label="我的钓竿" disabled><option value="">先读取背包</option></select><button id="inventory-load-rod" type="button" disabled>复制到当前模拟方案</button></div>
            <p id="inventory-build-note" class="muted" role="status"></p>
          </section>
          <div class="sm-step-title"><h3>01 <span>方案与钓点</span></h3><span>A / B 对比</span></div>
          <section class="ws-col">
            <div class="toolbar tool-plan-actions">
              <div class="tool-segments" role="group" aria-label="当前编辑方案">
                <button id="plan-a" type="button" aria-pressed="true">方案 A</button>
                <button id="plan-b" type="button" aria-pressed="false">方案 B</button>
              </div>
              <button id="copy-plan" type="button">复制到另一方案</button>
              <button id="clear-plan" class="tool-danger tool-quiet" type="button">清空方案</button>
              <button id="load-smelt" type="button">读取熔炼产物</button>
              <label class="check"><input type="checkbox" id="research-mode"> 自由试算</label>
            </div>
            <div class="toolbar">
              <input id="plan-name" aria-label="方案名称">
              <select id="spot-select" aria-label="钓点"></select>
              <button id="save-plan" class="tool-primary" type="button">保存方案</button>
              <select id="saved-plans" aria-label="已保存方案"></select>
              <button id="load-plan" type="button">读取</button>
              <button id="delete-plan" class="tool-danger tool-quiet" type="button">删除已存方案</button>
            </div>
            <div class="toolbar tool-share-actions">
              <button id="share-link" type="button">生成链接</button>
              <button id="export-code" type="button">导出方案码</button>
              <button id="import-code" type="button">导入方案码</button>
              <button id="adopt-import" type="button">另存为当前规则</button>
              <input id="share-code" class="wiki-code-input" aria-label="方案码">
              <a id="share-link-output" class="button" hidden>打开分享链接</a>
            </div>
          </section>
          <div class="sm-step-title"><h3>02 <span>组件编辑</span></h3><span id="slot-title">七个部位逐项调整</span></div>
          <section class="ws-col"><div id="slots"></div></section>
        </fieldset>
        <aside class="sm-preview-panel" aria-label="配装计算结果">
          <header><h3>计算结果</h3><span>实时更新</span></header>
          <div class="wiki-preview-block"><h4>当前结果</h4><div id="current-result"></div></div>
          <div class="wiki-preview-block"><h4>对比结果</h4><div id="compare-result"></div></div>
        </aside>
      </div>
    </section>
  </main>
</div>
  <script src="/js/data.js"></script>
  <script src="/wiki/js/core.js"></script>
  <script src="/wiki/tools/inventory.js"></script>
  <script src="/wiki/tools/build.js"></script>
</body>
</html>
