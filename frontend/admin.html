<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钓鱼后台管理</title>
  <link rel="stylesheet" href="css/admin.css?v=0.23.0-admin1" />
  <!-- 远洋 CSS 像素海图：后台「🎣 钓点管理 · 远洋图」页签与玩家端共用同一份底图 -->
  <link rel="stylesheet" href="css/voyage-map.css?v=0.22.0" />
  <link rel="stylesheet" href="css/mail.css?v=0.22.0-mail1" />
  <link rel="stylesheet" href="css/gear.css?v=0.22.0" />
</head>
<body>
  <!-- 登录浮层 -->
  <div id="login" class="login-overlay">
    <div class="login-card">
      <div class="brand-big">🛡 钓鱼后台管理</div>
      <div class="login-sub">使用已授权的管理员账号和验证器动态验证码登录</div>
      <input id="login-user" class="ipt" placeholder="用户名" autocomplete="username" />
      <input id="login-pass" class="ipt" type="password" placeholder="密码" autocomplete="current-password" />
      <input id="login-otp" class="ipt" inputmode="numeric" maxlength="6" placeholder="6 位动态验证码" autocomplete="one-time-code" />
      <button id="login-btn" class="btn primary big">登录管理后台</button>
      <div id="login-msg" class="login-msg"></div>
      <div class="login-foot">游戏入口：<a href="index.html">index.html</a></div>
    </div>
  </div>

  <!-- 主界面 -->
  <header class="topbar">
    <div class="brand">
      <!-- 窄屏用：侧栏收成抽屉，这个键负责打开/关闭 -->
      <button id="nav-toggle" class="btn mini nav-toggle" type="button" aria-controls="nav-sidebar" aria-expanded="false" title="打开页面菜单">☰ 页面</button>
      <span>🛡 钓鱼后台管理 <span class="ver">admin</span></span>
    </div>
    <div class="top-right">
      <span id="who" class="who"></span>
      <button id="logout-btn" class="btn ghost">退出</button>
    </div>
  </header>

  <div class="layout">
    <aside id="nav-sidebar" class="sidebar">
      <!-- 21 个页面按业务分组展示，搜索框按关键词过滤（只隐藏，不改变页面顺序） -->
      <div class="nav-search" id="nav-search">
        <input id="nav-filter" class="ipt" type="search" placeholder="搜索页面…" aria-label="搜索后台页面" autocomplete="off" />
        <button id="nav-filter-clear" class="nav-search-clear" type="button" title="清空搜索" aria-label="清空搜索">✕</button>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>
    <div id="nav-scrim" class="nav-scrim"></div>
    <main id="main" class="content"></main>
  </div>

  <button id="scroll-top" class="scroll-top" type="button" title="回到页头" aria-label="回到页头">↑</button>
  <div id="toast" class="toast"></div>

  <!-- 数据目录（UMD，与游戏前端共用）：账号管理的物品名称显示 / 新增物品下拉 / 定制配件生成依赖它 -->
  <script src="js/data.js?v=0.22.0"></script>
  <script src="js/features.js?v=0.22.0"></script>
  <!-- 远洋海图（CSS 像素图）：后台「🎣 钓点管理 · 远洋图」页签与玩家端共用同一份底图 -->
  <script src="js/voyage-map.js?v=0.22.0"></script>
  <script src="js/admin-mail.js?v=0.22.0-mail1"></script>
  <script src="js/admin-operations.js?v=0.22.0-mail1"></script>
  <script src="js/gear.js?v=0.22.0-mail1"></script>
  <script src="js/admin-gear.js?v=0.22.0-mail1"></script>
  <script src="js/admin.js?v=0.23.0-admin1"></script>
</body>
</html>
