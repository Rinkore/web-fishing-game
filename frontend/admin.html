<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钓鱼后台管理</title>
  <link rel="stylesheet" href="css/tokens.css?v=0.27.2" />
  <link rel="stylesheet" href="css/admin.css?v=0.27.2" />
  <!-- CSS 世界地图：钓点定位与玩家端共用底图与坐标投影 -->
  <link rel="stylesheet" href="css/voyage-map.css?v=0.27.2" />
  <link rel="stylesheet" href="css/mail.css?v=0.27.2" />
  <link rel="stylesheet" href="css/gear.css?v=0.27.2" />
</head>
<body>
  <!-- 登录浮层 -->
  <div id="login" class="login-overlay">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand-big">🛡 钓鱼后台管理</div>
      <div class="login-sub">使用已授权的管理员账号和验证器动态验证码登录</div>
      <label class="sr-only" for="login-user">用户名</label>
      <input id="login-user" class="ipt" placeholder="用户名" autocomplete="username" />
      <label class="sr-only" for="login-pass">密码</label>
      <input id="login-pass" class="ipt" type="password" placeholder="密码" autocomplete="current-password" />
      <label class="sr-only" for="login-otp">6 位动态验证码</label>
      <input id="login-otp" class="ipt" inputmode="numeric" maxlength="6" placeholder="6 位动态验证码" autocomplete="one-time-code" />
      <button id="login-btn" class="btn primary big" type="submit">登录管理后台</button>
      <div id="login-msg" class="login-msg" role="status" aria-live="polite"></div>
      <div class="login-foot">游戏入口：<a href="index.html">index.html</a></div>
    </form>
  </div>

  <!-- 主界面 -->
  <header class="topbar">
    <div class="brand">🛡 钓鱼后台管理 <span class="ver">admin</span></div>
    <div class="top-right">
      <span id="who" class="who"></span>
      <button id="logout-btn" class="btn ghost">退出</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav id="nav" class="nav"></nav>
    </aside>
    <main id="main" class="content"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- 数据目录（UMD，与游戏前端共用）：账号管理的物品名称显示 / 新增物品下拉 / 定制配件生成依赖它 -->
  <script src="js/data.js?v=0.27.2"></script>
  <script src="js/features.js?v=0.27.2"></script>
  <!-- CSS 世界地图及近岸 / 远洋坐标兼容层 -->
  <script src="js/voyage-map.js?v=0.27.2"></script>
  <script src="js/admin-edit.js?v=0.27.2"></script>
  <script src="js/admin-pool-import.js?v=0.27.2"></script>
  <script src="js/admin-mail.js?v=0.27.2"></script>
  <script src="js/admin-operations.js?v=0.27.2"></script>
  <script src="js/gear.js?v=0.27.2"></script>
  <script src="js/admin-gear.js?v=0.27.2"></script>
  <script src="js/admin-house.js?v=0.27.2"></script>
  <!-- 本地二维码生成（MIT，qrcode-generator）供验证器密钥弹窗使用；不依赖外部服务 -->
  <script src="js/vendor/qrcode.js?v=0.27.2"></script>
  <script src="js/admin.js?v=0.27.2"></script>
</body>
</html>
