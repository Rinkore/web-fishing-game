# Isolated synthetic acceptance only. Named volume exercises Docker's disk path.
services:
  postgres:
    image: ${FISHING_GO_POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650}
    environment:
      POSTGRES_DB: fishing_acceptance
      POSTGRES_USER: fishing_test_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ['127.0.0.1::5432']
    volumes: ['acceptance-data:/var/lib/postgresql']
    command: ['postgres', '-c', 'fsync=on', '-c', 'synchronous_commit=on', '-c', 'full_page_writes=on']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fishing_test_admin -d fishing_acceptance']
      interval: 1s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s
  acceptance:
    image: ${FISHING_GO_TEST_IMAGE:-golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195}
    profiles: ['acceptance']
    environment:
      FISHING_GO_ACCEPTANCE_URL: postgres://fishing_test_admin:local-test-only@postgres:5432/fishing_acceptance?sslmode=disable
      FISHING_GO_ACCEPTANCE_PHASE: ${FISHING_GO_ACCEPTANCE_PHASE:-run}
      FISHING_GO_ACCEPTANCE_PLAYERS: ${FISHING_GO_ACCEPTANCE_PLAYERS:-100}
      FISHING_GO_ACCEPTANCE_SECONDS: ${FISHING_GO_ACCEPTANCE_SECONDS:-60}
      GOTOOLCHAIN: local
      GOPROXY: ${FISHING_GO_TEST_GOPROXY:-https://proxy.golang.org}
    volumes:
      - ../../server-go:/src:ro
      - go-cache:/go/pkg/mod
      - build-cache:/root/.cache/go-build
    working_dir: /work
    command: ['bash', '-c', 'set -euo pipefail; cp -a /src/. /work/; go run ./cmd/acceptance']
volumes:
  acceptance-data:
  go-cache:
  build-cache:
