name: web-fishing-wiki-test

services:
  wiki-test:
    build:
      context: .
      dockerfile: docker/wiki-test/Dockerfile
      args:
        NODE_IMAGE: ${WIKI_TEST_NODE_IMAGE:-node:22-alpine}
        SOURCE_COMMIT: ${WIKI_TEST_SOURCE_COMMIT:-0000000000000000000000000000000000000000}
    image: web-fishing-wiki-test:local
    container_name: web-fishing-wiki-test
    ports:
      # 只绑定本机回环地址，避免测试服务被局域网访问。
      - "127.0.0.1:${WIKI_TEST_PORT:-19000}:9000"
    environment:
      PORT: "9000"
      BIND_HOST: "0.0.0.0"
      FISHING_DATA_DIR: /data
      # 1 = 攻略自动通过（默认）；设为 0 可测试「提交 → 待审核 → 管理员审核」完整链路。
      WIKI_GUIDE_AUTO_APPROVE: "${WIKI_TEST_AUTO_APPROVE:-1}"
    volumes:
      - wiki-test-data:/data
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  wiki-test-data:
    name: web-fishing-wiki-test-data
