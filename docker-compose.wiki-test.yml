name: web-fishing-wiki-test

services:
  postgres:
    image: ${WIKI_TEST_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    environment:
      POSTGRES_DB: fishing_wiki_test
      POSTGRES_USER: fishing_wiki_test
      POSTGRES_PASSWORD: local-wiki-test-only
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fishing_wiki_test -d fishing_wiki_test']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - wiki-test-postgres:/var/lib/postgresql/data
    stop_grace_period: 10s
  wiki-test:
    build:
      context: .
      dockerfile: docker/wiki-test/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    image: web-fishing-wiki-test:local
    container_name: web-fishing-wiki-test
    ports:
      # 只绑定本机回环地址，避免测试服务被局域网访问。
      - "127.0.0.1:${WIKI_TEST_PORT:-19000}:9000"
    environment:
      FISHING_GO_DATABASE_URL: postgres://fishing_wiki_test:local-wiki-test-only@postgres:5432/fishing_wiki_test?sslmode=disable
      FISHING_GO_MIGRATION_DATABASE_URL: postgres://fishing_wiki_test:local-wiki-test-only@postgres:5432/fishing_wiki_test?sslmode=disable
      FISHING_GO_MFA_KEY: ${WIKI_TEST_MFA_KEY:-}
      # 1 = 攻略自动通过（默认）；设为 0 可测试「提交 → 待审核 → 管理员审核」完整链路。
      WIKI_GUIDE_AUTO_APPROVE: "${WIKI_TEST_AUTO_APPROVE:-1}"
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  wiki-test-postgres:
    name: web-fishing-wiki-test-postgres
