name: Go rewrite baseline

on:
  push:
    paths: ['server-go/**', 'tools/go-rewrite/**', 'deploy/go-test/**', 'tests/go-rewrite-inventory.test.js', 'backend/server.js', 'frontend/js/data.js', 'frontend/js/net.js', '.github/workflows/go-rewrite.yml']
  pull_request:
    paths: ['server-go/**', 'tools/go-rewrite/**', 'deploy/go-test/**', 'tests/go-rewrite-inventory.test.js', 'backend/server.js', 'frontend/js/data.js', 'frontend/js/net.js', '.github/workflows/go-rewrite.yml']

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server-go/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Check source inventory and legacy rule fixtures
        shell: bash
        run: |
          set -euo pipefail
          node tools/go-rewrite/inventory.js --check
          node --test tests/go-rewrite-inventory.test.js 2>&1 | tail -40
      - name: Format, build, vet and test
        working-directory: server-go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod verify
          go build ./...
          go vet ./...
          go test -count=1 ./... 2>&1 | tail -40
      - name: Race detection on Linux
        if: runner.os == 'Linux'
        working-directory: server-go
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./... 2>&1 | tail -40
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: fishing_test
          POSTGRES_USER: fishing_test_admin
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fishing_test_admin -d fishing_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server-go/go.mod
          cache: false
      - name: Real PostgreSQL transactions and race detection
        working-directory: server-go
        env:
          FISHING_GO_TEST_DATABASE_URL: postgres://fishing_test_admin:local-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/fishing_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./... 2>&1 | tail -40
