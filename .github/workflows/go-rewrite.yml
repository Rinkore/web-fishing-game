name: Go server

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit to validate for a release
        required: false
        type: string
        default: ''
  push:
    paths: ['server-go/**', 'tools/go-rewrite/**', 'tools/release/**', 'deploy/go-test/**', 'deploy/linux/**', 'tests/go-rewrite-route-coverage.test.js', 'tests/linux-deploy.test.py', 'tests/release-*.test.*', 'dist/release.ps1', 'frontend/js/data.js', 'frontend/wiki/content/content.json', 'docker/**', 'docker-compose.wiki-test.yml', 'tools/start-go.js', 'run.bat', 'package.json', '.github/workflows/**']
  pull_request:
    paths: ['server-go/**', 'tools/go-rewrite/**', 'tools/release/**', 'deploy/go-test/**', 'deploy/linux/**', 'tests/go-rewrite-route-coverage.test.js', 'tests/linux-deploy.test.py', 'tests/release-*.test.*', 'dist/release.ps1', 'frontend/js/data.js', 'frontend/wiki/content/content.json', 'docker/**', 'docker-compose.wiki-test.yml', 'tools/start-go.js', 'run.bat', 'package.json', '.github/workflows/**']

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server-go/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Check generated catalog, rule fixtures and wiki snapshot
        shell: bash
        run: |
          set -euo pipefail
          node tools/go-rewrite/catalog.js --check
          node tools/go-rewrite/native-rules-fixture.js --check
          node tools/go-rewrite/workshop-fixture.js --check
          node tools/go-rewrite/mall-fixture.js --check
          node tools/go-rewrite/chest-fixture.js --check
          node tools/go-rewrite/wiki-content.js --check
      - name: Check legacy route coverage of the Go gateway
        shell: bash
        run: |
          set -euo pipefail
          node tools/go-rewrite/route-coverage.js --check
          node --test tests/go-rewrite-route-coverage.test.js 2>&1 | tail -40
      - name: Check Linux release tooling and deployment failure handling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/release/build-linux.sh tools/release/push-linux-package.sh \
            tools/release/tune-lossy-path.sh \
            deploy/linux/install.sh deploy/linux/deploy.sh
          node --check tools/release/migration-hash.js
          node tools/release/migration-hash.js
          bash tests/release-push-linux-package.test.sh 2>&1 | tail -40
          python3 tests/linux-deploy.test.py 2>&1 | tail -40
          node --test tests/release-start.test.js 2>&1 | tail -40
      - name: Check release publisher without network writes
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/release-publish.test.ps1 | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format, build, vet and test
        working-directory: server-go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod verify
          go build ./...
          go vet ./...
          log="$(mktemp)"
          status=0
          go test -count=1 ./... >"$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::go test failure markers"
            grep -nE -- '--- FAIL|^FAIL|^panic:|running tests:' "$log" | head -40 || true
            echo "::endgroup::"
            echo "::group::go test full failure log"
            cat "$log"
            echo "::endgroup::"
          else
            tail -20 "$log"
          fi
          exit "$status"
      - name: Race detection on Linux
        if: runner.os == 'Linux'
        working-directory: server-go
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          status=0
          go test -race -count=1 ./... >"$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::go test failure markers"
            grep -nE -- '--- FAIL|^FAIL|^panic:|running tests:' "$log" | head -40 || true
            echo "::endgroup::"
            echo "::group::go test full failure log"
            cat "$log"
            echo "::endgroup::"
          else
            tail -20 "$log"
          fi
          exit "$status"
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: fishing_test
          POSTGRES_USER: fishing_test_admin
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fishing_test_admin -d fishing_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server-go/go.mod
          cache: false
      - name: Real PostgreSQL transactions and race detection
        working-directory: server-go
        env:
          FISHING_GO_TEST_DATABASE_URL: postgres://fishing_test_admin:local-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/fishing_test?sslmode=disable
        run: |
          set -euo pipefail
          log="$(mktemp)"
          status=0
          go test -race -count=1 -timeout=15m ./... >"$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::go test failure markers"
            grep -nE -- '--- FAIL|^FAIL|^panic:|running tests:' "$log" | head -40 || true
            echo "::endgroup::"
            echo "::group::go test full failure log"
            cat "$log"
            echo "::endgroup::"
          else
            tail -20 "$log"
          fi
          exit "$status"
