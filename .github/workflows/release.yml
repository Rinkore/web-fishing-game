name: Linux release and deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v0.21.5
        required: true
        type: string
      skip_tests:
        description: Skip repeated CI only when this exact release commit has passed local acceptance
        required: false
        type: boolean
        default: false
      reuse_release:
        description: Deploy the existing verified release assets without rebuilding or republishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server-go/go.mod
          cache: false
      - name: Verify tag, main ancestry and release version
        id: verify
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a vX.Y.Z tag'; exit 1; }
          git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"
          commit="$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          actual_version="$(go -C server-go run ./cmd/repo-tool version)"
          test "$actual_version" = "$RELEASE_VERSION"
          test -s "dist/notes-$RELEASE_VERSION.md"
          printf 'version=%s\ncommit=%s\n' "$RELEASE_VERSION" "$commit" >> "$GITHUB_OUTPUT"

  test:
    needs: source
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    uses: ./.github/workflows/go-rewrite.yml
    with:
      source-ref: ${{ needs.source.outputs.commit }}

  publish:
    needs: [source, test]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      asset-sha256: ${{ steps.manifest.outputs.sha256 }}
      migrations-sha256: ${{ steps.manifest.outputs.migrationsSha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ !inputs.reuse_release }}
        with:
          go-version-file: server-go/go.mod
          cache: false
      - name: Build Linux amd64 package and integrity manifest
        if: ${{ !inputs.reuse_release }}
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          bash tools/release/build-linux.sh "$RELEASE_VERSION" 2>&1 | tail -40
      - name: Download and verify existing release assets
        if: ${{ inputs.reuse_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p output/release
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern linux-release.json --pattern web-fishing-game-linux-amd64.tar.gz \
            --dir output/release
          export MIGRATIONS_SHA256="$(node tools/release/migration-hash.js)"
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const root = 'output/release/';
          const manifest = JSON.parse(fs.readFileSync(root + 'linux-release.json', 'utf8'));
          const expected = {
            version: process.env.RELEASE_VERSION,
            sourceCommit: process.env.SOURCE_COMMIT,
            migrationsSha256: process.env.MIGRATIONS_SHA256,
            asset: 'web-fishing-game-linux-amd64.tar.gz',
          };
          if (Object.entries(expected).some(([key, value]) => manifest[key] !== value)
              || !/^[0-9a-f]{64}$/.test(manifest.sha256)) {
            throw new Error('Published manifest differs from the selected release source');
          }
          const digest = crypto.createHash('sha256').update(fs.readFileSync(root + manifest.asset)).digest('hex');
          if (digest !== manifest.sha256) throw new Error('Published package checksum mismatch');
          console.log(`Reusing verified ${manifest.version} package from ${manifest.sourceCommit}`);
          NODE
      - name: Export tested package identity
        id: manifest
        run: |
          go -C server-go run ./cmd/repo-tool manifest-outputs output/release/linux-release.json
      - name: Publish through the repository release entry point
        if: ${{ !inputs.reuse_release }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./dist/release.ps1 -Version $env:RELEASE_VERSION -LinuxManifest ./output/release/linux-release.json

  deploy:
    needs: [source, publish]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: linux-go
    concurrency:
      group: linux-go-deploy
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      ASSET_SHA256: ${{ needs.publish.outputs.asset-sha256 }}
      MIGRATIONS_SHA256: ${{ needs.publish.outputs.migrations-sha256 }}
    steps:
      # The transfer tool comes from the workflow revision itself, so a retry of
      # an older tag still runs the current uploader.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Download and verify the published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern linux-release.json --pattern web-fishing-game-linux-amd64.tar.gz \
            --dir "$RUNNER_TEMP/release"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          manifest = json.loads((root / 'linux-release.json').read_text())
          expected = {
              'version': os.environ['RELEASE_VERSION'],
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'migrationsSha256': os.environ['MIGRATIONS_SHA256'],
              'asset': 'web-fishing-game-linux-amd64.tar.gz',
              'sha256': os.environ['ASSET_SHA256'],
          }
          if manifest != expected:
              raise SystemExit('Published manifest differs from the tested package')
          PY
          cd "$RUNNER_TEMP/release"
          printf '%s  %s\n' "$ASSET_SHA256" web-fishing-game-linux-amd64.tar.gz | sha256sum --check --status
      - name: Install SSH identity and validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'Configure SSH_HOST for linux-go'; exit 1; }
          [[ "$SSH_USER" == fishing-deploy ]] || { echo 'SSH_USER must be the dedicated fishing-deploy account'; exit 1; }
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && ((10#$port > 0 && 10#$port <= 65535)) || { echo 'Invalid SSH_PORT'; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]] || { echo 'Configure DEPLOY_PATH for linux-go'; exit 1; }
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS" || { echo 'Configure SSH_KEY and SSH_KNOWN_HOSTS for linux-go'; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/release-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/release-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/release-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/release-ssh/key" "$RUNNER_TEMP/release-ssh/known_hosts"
          printf 'DEPLOY_SSH_HOST=%s\nDEPLOY_SSH_USER=%s\nDEPLOY_SSH_PORT=%s\nDEPLOY_ROOT=%s\n' \
            "$SSH_HOST" "$SSH_USER" "$port" "$DEPLOY_PATH" >> "$GITHUB_ENV"
      - name: Tune the sender for the long-haul transfer path
        run: bash tools/release/tune-lossy-path.sh
      - name: Transfer package and run the installed Linux deployer
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TRANSFER_STREAMS: ${{ vars.DEPLOY_TRANSFER_STREAMS }}
        run: |
          set -euo pipefail
          # Short helper calls below share one multiplexed connection: repeated
          # handshakes and per-connection stalls used to dominate this step.
          # The package itself does not travel over that connection. This host
          # sits behind a ~245 ms, ~13% loss international path where a single
          # TCP flow collapses to roughly 25 KB/s, which is why one sequential
          # stream needed about three minutes per 4 MiB and exhausted its
          # budget on every release. The step above tunes the runner side of the
          # path, and tools/release/push-linux-package.sh spreads the archive
          # over several parallel flows, verifies every chunk and resumes from
          # the chunks that already match. Transfers still avoid the SFTP
          # subsystem: scp starts it before the first byte, so a stalled
          # sftp-server holds the step until the wall-clock timeout kills it.
          options=(-i "$RUNNER_TEMP/release-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/release-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o ControlMaster=auto -o "ControlPath=$RUNNER_TEMP/release-ssh/control" -o ControlPersist=120)
          destination="$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST"
          incoming="$DEPLOY_ROOT/incoming/$SOURCE_COMMIT"
          remote_package="$incoming/web-fishing-game-linux-amd64.tar.gz"
          step_started=$(date -u +%s)
          phase_started=$step_started
          mark() {
            local now
            now=$(date -u +%s)
            printf '%s [step %ss, phase %ss]\n' "$1" "$((now - step_started))" "$((now - phase_started))"
            phase_started=$now
          }
          remote() {
            # Bound every short remote helper: a stalled session channel must not
            # hold the deployment job for its whole wall-clock budget.
            timeout 120 ssh "${options[@]}" -p "$DEPLOY_SSH_PORT" "$destination" "$1"
          }
          archive_verified() {
            remote "test -f '$1' && printf '%s  %s\n' '$ASSET_SHA256' '$1' | sha256sum --check --status"
          }
          remote "mkdir -p -- '$incoming'"
          mark 'Prepared the incoming directory.'
          # An operator can stage the published package through another connection.
          # Treat it as untrusted: require the exact verified hash before reuse.
          staged="/var/tmp/fishing-release-$ASSET_SHA256/web-fishing-game-linux-amd64.tar.gz"
          if remote "test -f '$staged' && cp -- '$staged' '$remote_package'" && archive_verified "$remote_package"; then
            mark 'Reused the staged package after SHA-256 verification.'
          else
            # The transfer script owns its own connections: every worker holds a
            # separate TCP flow, which is what the failing single-stream loop
            # could not do. It reuses a target that already matches ASSET_SHA256,
            # so a rerun after a partial upload only sends the missing chunks.
            bash tools/release/push-linux-package.sh \
              --host "$DEPLOY_SSH_HOST" --port "$DEPLOY_SSH_PORT" --user "$DEPLOY_SSH_USER" \
              --key "$RUNNER_TEMP/release-ssh/key" --known-hosts "$RUNNER_TEMP/release-ssh/known_hosts" \
              --control-path "$RUNNER_TEMP/release-ssh/control" \
              --local "$RUNNER_TEMP/release/web-fishing-game-linux-amd64.tar.gz" \
              --remote "$remote_package" --sha256 "$ASSET_SHA256" \
              --streams "${DEPLOY_TRANSFER_STREAMS:-8}" --deadline 1200 \
              || { echo 'Package upload failed; stage the package and rerun the deployment job.'; exit 1; }
            archive_verified "$remote_package" || { echo 'Uploaded package SHA-256 mismatch; stage the package and rerun the deployment job.'; exit 1; }
            mark 'Uploaded the release package.'
          fi
          timeout 120 ssh "${options[@]}" -p "$DEPLOY_SSH_PORT" "$destination" \
            "cat > '$incoming/linux-release.json'" < "$RUNNER_TEMP/release/linux-release.json"
          mark 'Uploaded the release manifest.'
          read -r kind current_commit <<< "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" --jq '.object | [.type, .sha] | @tsv')"
          for attempt in {1..8}; do
            [[ "$kind" == commit ]] && break
            [[ "$kind" == tag && "$current_commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release tag object'; exit 1; }
            read -r kind current_commit <<< "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$current_commit" --jq '.object | [.type, .sha] | @tsv')"
          done
          [[ "$kind" == commit && "$current_commit" == "$SOURCE_COMMIT" ]] || { echo 'Release tag moved after build; refusing deployment'; exit 1; }
          mark 'Verified the release tag for the deployer.'
          echo 'Starting the installed deployer and health checks.'
          ssh "${options[@]}" -p "$DEPLOY_SSH_PORT" "$destination" \
            "sudo -n /usr/local/sbin/fishing-release-deploy '$incoming/linux-release.json'"
          mark 'Deployer finished; services and probes verified.'
      - name: Remove temporary SSH identity
        if: always()
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/release-ssh/control"
          timeout 15 ssh -o "ControlPath=$control" -O exit "${DEPLOY_SSH_USER:-fishing-deploy}@${DEPLOY_SSH_HOST:-localhost}" >/dev/null 2>&1 || true
          rm -f -- "$RUNNER_TEMP/release-ssh/key" "$RUNNER_TEMP/release-ssh/known_hosts" "$control"
