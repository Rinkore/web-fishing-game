name: deepfish-dev

x-game-build: &game-build
  context: .
  dockerfile: docker/game/Dockerfile
  args:
    GOPROXY: ${FISHING_GO_GOPROXY:-https://goproxy.cn,direct}
    FISHING_GO_IMAGE_REGISTRY: ${FISHING_GO_IMAGE_REGISTRY:-docker.m.daocloud.io}

services:
  postgres:
    image: ${FISHING_GO_POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650}
    environment:
      POSTGRES_DB: ${FISHING_DB_NAME:-fishing_dev}
      POSTGRES_USER: ${FISHING_DB_USER:-fishing_dev}
      POSTGRES_PASSWORD: ${FISHING_DB_PASSWORD:-local-development-only}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${FISHING_DB_PORT:-5432}:5432"
    volumes:
      - fishing-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s

  migrate:
    image: deepfish-game:local
    build: *game-build
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FISHING_GO_MIGRATION_DATABASE_URL: postgres://${FISHING_DB_USER:-fishing_dev}:${FISHING_DB_PASSWORD:-local-development-only}@postgres:5432/${FISHING_DB_NAME:-fishing_dev}?sslmode=disable
      TZ: ${TZ:-Asia/Shanghai}
    entrypoint: ["/app/migrate"]
    command: ["up"]
    restart: "no"

  catalog:
    image: deepfish-game:local
    build: *game-build
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      FISHING_GO_MIGRATION_DATABASE_URL: postgres://${FISHING_DB_USER:-fishing_dev}:${FISHING_DB_PASSWORD:-local-development-only}@postgres:5432/${FISHING_DB_NAME:-fishing_dev}?sslmode=disable
      TZ: ${TZ:-Asia/Shanghai}
    entrypoint: ["/app/catalog"]
    command: ["defaults"]
    restart: "no"

  game:
    image: deepfish-game:local
    build: *game-build
    pull_policy: build
    depends_on:
      catalog:
        condition: service_completed_successfully
    environment:
      FISHING_GO_DATABASE_URL: postgres://${FISHING_DB_USER:-fishing_dev}:${FISHING_DB_PASSWORD:-local-development-only}@postgres:5432/${FISHING_DB_NAME:-fishing_dev}?sslmode=disable
      FISHING_GO_LISTEN: 0.0.0.0:9000
      FISHING_GO_FRONTEND_DIR: /app/frontend
      FISHING_GO_TIMEZONE: ${TZ:-Asia/Shanghai}
      FISHING_GO_DB_MAX_CONNS: ${FISHING_GO_DB_MAX_CONNS:-16}
      FISHING_GO_MFA_KEY: ${FISHING_GO_MFA_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${FISHING_HTTP_PORT:-9000}:9000"
    restart: unless-stopped

volumes:
  fishing-db:
